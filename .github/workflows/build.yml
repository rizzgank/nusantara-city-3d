name: Build NusantaraCity IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Organize & Verify Web Assets
        run: |
          mkdir -p www/css www/js
          find . -maxdepth 5 -name "style.css" ! -path "./www/css/style.css" -exec cp {} www/css/style.css \;
          find . -maxdepth 5 -name "maps_weather.js" ! -path "./www/js/maps_weather.js" -exec cp {} www/js/maps_weather.js \;
          find . -maxdepth 5 -name "graphics_hd.js" ! -path "./www/js/graphics_hd.js" -exec cp {} www/js/graphics_hd.js \;
          find . -maxdepth 5 -name "city_rci.js" ! -path "./www/js/city_rci.js" -exec cp {} www/js/city_rci.js \;
          find . -maxdepth 5 -name "main.js" ! -path "./www/js/main.js" -exec cp {} www/js/main.js \;
          test -f www/js/maps_weather.js
          test -f www/js/graphics_hd.js
          test -f www/js/city_rci.js
          test -f www/js/main.js

      - name: Download Three.js Offline Engine
        run: |
          curl -L https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js -o www/js/three.min.js

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Pasang Logo Aplikasi iOS
        run: |
          mkdir -p resources
          cp www/assets/logo-nusantara.svg resources/icon.svg
          if ! npx -y @capacitor/assets generate --ios; then
            brew install librsvg
            ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
            mkdir -p "$ICON_DIR"
            rsvg-convert -w 1024 -h 1024 www/assets/logo-nusantara.svg -o "$ICON_DIR/AppIcon-512@2x.png"
            printf '{"images":[{"filename":"AppIcon-512@2x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}\n' > "$ICON_DIR/Contents.json"
          fi

      - name: Build Unsigned iOS App
        run: |
          xcodebuild -project ios/NusantaraCity.xcodeproj \
            -scheme NusantaraCity \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/NusantaraCity.app Payload/
          zip -qr NusantaraCity.ipa Payload

      - name: Upload NusantaraCity.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NusantaraCity-IPA
          path: NusantaraCity.ipa
